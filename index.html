<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station météorologique de Loun</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app">
    <div id="menu" class="menu">
        <button id="menu-toggle" class="menu-button">☰</button>

        <div id="menu-panel" class="menu-panel">
            <div class="menu-header">
                <h2>Réglages</h2>
                <button id="menu-close" class="menu-close">✕</button>
            </div>

            <div class="menu-section">
                <h3>Carte</h3>
                <div class="menu-row">
                    <label>
                        <input type="radio" name="map-choice" value="blitzortung" checked> Orages (Blitzortung)
                    </label>
                    <label>
                        <input type="radio" name="map-choice" value="adsb"> Vol (ADSB.fi)
                    </label>
                    
                    <label>
                        <input type="radio" name="map-choice" value="windy"> Vent (Windy)
                    </label>
                </div>
            </div>

            <div class="menu-section">
                <h3>Polices</h3>
                <div class="menu-row">
                    <label><input type="radio" name="font-choice" value="system" checked> Système</label>
                    <label><input type="radio" name="font-choice" value="serif"> Serif</label>
                    <label><input type="radio" name="font-choice" value="mono"> Mono</label>
                    <label><input type="radio" name="font-choice" value="rounded"> Arrondie</label>
                    <label><input type="radio" name="font-choice" value="display"> Titre</label>
                </div>
            </div>

            <div class="menu-section">
                <h3>Fond</h3>
                <div class="color-grid" id="bg-color-grid">
                </div>
            </div>

            <div class="menu-section">
                <h3>Couleur principale</h3>
                <div class="color-grid" id="accent-color-grid">
                </div>
            </div>

            <div class="menu-section">
                <h3>Villes</h3>
                <div id="city-list" class="city-list">
                </div>
            </div>

            <div class="menu-section">
                <h3>Messages</h3>
                <label>
                    <input type="radio" name="message-mode" value="custom" checked>
                    Personnalisés
                </label>
                <label>
                    <input type="radio" name="message-mode" value="neutral">
                    Neutres
                </label>
            </div>
        </div>
    </div>
    <div class="layout">
      <aside id="left" class="left">
        <div id="hours" class="hours">11:26</div>

        <div id="cities" class="cities">
          <button id="arrow-left" class="arrow">◄</button>
          <div id="city-name" class="city-name">Paris</div>
          <button id="arrow-right" class="arrow">►</button>
        </div>

        <div class="temp-row">
            <div id="temperature" class="temperature">4°</div>
            <div id="weather-extra" class="weather-extra">
                <div id="wind" class="extra-line">🌬️ -- km/h</div>
                <div id="humidity" class="extra-line">💧 -- %</div>
                <div id="pressure" class="extra-line">🕛 -- hPa</div>
            </div>
        </div>

        <div id="animation" class="animation">
          
        </div>
        <div id="message" class="message">
          bonne journée à toi ma princesse &lt;3
        </div>
      </aside>

      <main id="right" class="right">
        <div class="map-wrapper">
            
            <iframe
                id="windy-frame"
                width="100%"
                height="100%"
                src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=km/h&zoom=5&overlay=wind&product=ecmwf&level=surface&lat=46.104&lon=1.89&message=true"
                frameborder="0">
            </iframe>
            <iframe
                id="blitzortung-frame"
                src="https://map.blitzortung.org/index.php?
                    interactive=1
                    &NavigationControl=0
                    &FullScreenControl=0
                    &ScaleControl=0
                    &Advertisment=0
                    &InfoDiv=0
                    &Cookies=0
                    &LinksCheckboxChecked=0
                    &LinksRangeValue=2
                    &MapStyleRangeValue=8
                    &Advertisment=0
                    &InfoDiv=0
                    &MenuButtonDiv=0
                    &AudioRangeValue=0
                #5/46.6/2.5"
                width="100%"
                height="100%"
                style="border:none;"
                loading="lazy">
            ></iframe>
            <iframe
                id="adsb-frame"
                src="https://globe.adsb.fi/?lat=46.60&lon=2.40&zoom=6&hideSidebar" 
                width="100%" 
                height="100%" 
                style="border: none;">
            </iframe>
        </div>

        <div class="graph-wrapper">
            <div id="hourly-weather" class="hourly-weather"></div>
            <canvas id="temp-graph"></canvas>
        </div>
      </main>
    </div>
  </div>

    <script src="js/cities.js"></script>
    <script src="js/message.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/blitz.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
